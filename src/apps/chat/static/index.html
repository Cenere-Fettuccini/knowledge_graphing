<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIManager | Chat</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f5f0e6, #e6efe6);
            color: #213126;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        main {
            width: min(760px, calc(100% - 32px));
            padding: 32px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 20px 60px rgba(33, 49, 38, 0.12);
        }
        h1 { margin-top: 0; font-size: 42px; }
        p { line-height: 1.7; color: #516056; }
        a { color: #476554; }
    </style>
</head>
<body>
    <main>
        <h1>Chat App</h1>
        <p>
            This isolated app surface is scaffolded and ready to be wired into the shared
            agent platform. It will become the dedicated general-purpose chat experience.
        </p>
        <p><a href="/">Back to platform shell</a></p>
    </main>
</body>
</html>
