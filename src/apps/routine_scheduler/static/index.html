<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIManager | Routine Scheduler</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top right, rgba(196, 155, 118, 0.28), transparent 30%),
                linear-gradient(135deg, #f7f1e8, #eef4ea);
            color: #213022;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        main {
            width: min(760px, calc(100% - 32px));
            padding: 32px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 20px 60px rgba(33, 48, 34, 0.12);
        }
        h1 { margin-top: 0; font-size: 42px; }
        p { line-height: 1.7; color: #59685a; }
        a { color: #6f7c44; }
    </style>
</head>
<body>
    <main>
        <h1>Routine Scheduler</h1>
        <p>
            This isolated app surface is ready for routines, recurring planning, and future
            scheduler-specific agent tools without leaking those details into other apps.
        </p>
        <p><a href="/">Back to platform shell</a></p>
    </main>
</body>
</html>
